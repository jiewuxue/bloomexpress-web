server {
     listen 80;
     listen 443 ssl http2;
     server_name apibloomexpress.eduyuwo.com;
     client_max_body_size 50M;
     #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
     ssl_certificate /etc/nginx/ssl/apibloomexpress.eduyuwo.com.pem;
     ssl_certificate_key /etc/nginx/ssl/apibloomexpress.eduyuwo.com.key;
     ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
     ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
     ssl_prefer_server_ciphers on;
     ssl_session_cache shared:SSL:10m;
     ssl_session_timeout 10m;
     gzip on;
     gzip_min_length 1024;
     gzip_buffers   4  8k;
     gzip_types   text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png application/vnd.ms-fontobject font/ttf font/opentype font/x-woff image/svg+xml;

     # 应用接口（对应 .env 的 SHOPRO_API_PATH=/app-api）
     location /app-api/ {
        proxy_redirect off;
        proxy_connect_timeout 60;
        proxy_read_timeout 60;
        proxy_pass http://127.0.0.1:48080;
        proxy_http_version 1.1;
        set_real_ip_from 0.0.0.0/0;
        real_ip_header  X-Forwarded-For;
        real_ip_recursive on;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
     }

     # WebSocket（对应 .env 的 SHOPRO_WEBSOCKET_PATH=/infra/ws，客服聊天等）
     location /infra/ws {
        proxy_redirect off;
        proxy_connect_timeout 60;
        proxy_pass http://127.0.0.1:48080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        set_real_ip_from 0.0.0.0/0;
        real_ip_header  X-Forwarded-For;
        real_ip_recursive on;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
     }

     # 后端文件访问（图片、文件下载等，不需要可删）
     location /admin-api/ {
        proxy_redirect off;
        proxy_connect_timeout 60;
        proxy_pass http://127.0.0.1:48080;
        proxy_http_version 1.1;
        set_real_ip_from 0.0.0.0/0;
        real_ip_header  X-Forwarded-For;
        real_ip_recursive on;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
     }

     access_log  /var/log/nginx/apibloomexpress.eduyuwo.com.log;
     error_log  /var/log/nginx/apibloomexpress.eduyuwo.com.error.log;
}
